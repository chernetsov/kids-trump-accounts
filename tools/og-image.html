<!doctype html>
<!-- Source for assets/img/og-image.jpg (the link preview in WhatsApp/Telegram/iMessage).
     Re-render at 1200x630 with any headless browser if the photos change. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,300..700;1,62.5..100,300..700&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f7f2e8; font-family: Inter, sans-serif; color: #131a2b; position: relative; }
  .glow { position: absolute; right: -200px; top: -260px; width: 900px; height: 900px; background: radial-gradient(closest-side, rgba(212,176,106,.38), rgba(212,176,106,0) 70%); }
  .copy { position: absolute; left: 80px; top: 92px; width: 560px; }
  .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #b88a3e; display: flex; align-items: center; gap: 12px; }
  .eyebrow::before { content: ""; width: 28px; height: 2px; background: currentColor; }
  h1 { font-family: "Noto Serif Display", serif; font-stretch: 72%; font-weight: 400; font-size: 118px; line-height: .95; margin: 26px 0 26px; letter-spacing: -.01em; }
  h1 em { font-style: italic; background: linear-gradient(100deg, #b88a3e 10%, #9a6f2c 55%, #d4b06a 95%); -webkit-background-clip: text; color: transparent; }
  p { font-size: 25px; line-height: 1.45; color: #464d61; margin: 0; }
  .card { position: absolute; width: 270px; background: #fffdf8; padding: 10px 10px 0; border-radius: 26px; box-shadow: 0 4px 10px rgba(19,26,43,.05), 0 30px 60px -20px rgba(19,26,43,.3); }
  .card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 18px; display: block; }
  .card div { font-family: "Noto Serif Display", serif; font-stretch: 72%; font-size: 34px; padding: 10px 8px 12px; }
  .a { left: 690px; top: 70px; transform: rotate(-5deg); }
  .b { left: 880px; top: 136px; transform: rotate(4deg); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="eyebrow">For Vera &amp; Alisa</div>
    <h1>Give a gift<br>that <em>grows</em>.</h1>
    <p>Instead of toys, a contribution to their Trump Accounts, invested for their future.</p>
  </div>
  <div class="card a"><img src="../assets/photos/vera.jpg" alt=""><div>Vera</div></div>
  <div class="card b"><img src="../assets/photos/alisa.jpg" alt=""><div>Alisa</div></div>
</body>
</html>
